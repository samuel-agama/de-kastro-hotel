<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Kastro Hotel | Admin Dashboard</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg-base: #060E1A;
      --color-bg-surface: #0B172A;
      --color-white: #ffffff;
      --color-brand-orange: #F5821F;
      --color-brand-orange-hover: #FFA24A;
      --color-ash-gray: #94A3B8;
      --color-border: rgba(255, 255, 255, 0.1);
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background-color: var(--color-bg-base);
      color: var(--color-bone-white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- LOGIN SCREEN --- */
    #login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
    }

    .login-card {
      background: var(--color-bg-surface);
      padding: 48px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-card h2 {
      font-family: var(--font-heading);
      color: var(--color-white);
      font-size: 32px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--color-border);
      color: var(--color-white);
      font-family: var(--font-body);
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
    }

    .login-error {
      color: #ff8a80;
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    .btn-solid {
      background-color: var(--color-brand-orange);
      color: #000;
      padding: 14px 28px;
      border: none;
      font-family: var(--font-body);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .btn-solid:hover {
      background-color: var(--color-brand-orange-hover);
    }

    /* --- DASHBOARD SCREEN (Hidden by default) --- */
    #dashboard-view {
      display: none;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 20px;
    }

    .dashboard-header h1 {
      font-family: var(--font-heading);
      color: var(--color-white);
      font-size: 36px;
      margin: 0;
    }

    .nav-tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-ash-gray);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--color-bg-surface);
      color: var(--color-brand-orange);
      border-color: var(--color-brand-orange);
    }

    .notification-badge {
      display: none;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--color-brand-orange);
      color: #000;
      font-size: 11px;
      font-weight: 700;
    }

    /* --- DATA TABLES --- */
    .table-container {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-ash-gray);
      background: rgba(0, 0, 0, 0.2);
    }

    td {
      font-size: 14px;
      color: var(--color-white);
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .status-pending { background: rgba(245, 130, 31, 0.2); color: var(--color-brand-orange); }
    .status-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .status-clean { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .status-dirty { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

    .unread-booking {
      background: rgba(245, 130, 31, 0.08) !important;
      border-left: 4px solid var(--color-brand-orange);
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-white);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }


    .action-btn:hover {
      border-color: var(--color-brand-orange);
      color: var(--color-brand-orange);
    }

    @media (max-width: 700px) {
      #dashboard-view {
        padding: 24px 12px;
      }

      .dashboard-header {
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      .dashboard-header h1 {
        font-size: 28px;
      }

      .nav-tabs {
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .tab-btn {
        flex: 1 1 30%;
        padding: 10px 12px;
      }

      #manual-booking-form {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }

      #manual-booking-form .btn-solid {
        grid-column: 1 / -1;
        height: auto !important;
        min-height: 42px;
        white-space: normal;
      }

      .table-container table,
      .table-container tbody,
      .table-container tr,
      .table-container td {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }

      .table-container table {
        min-width: 0;
      }

      .table-container thead {
        display: none;
      }

      .table-container tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
        border-bottom: 1px solid var(--color-border);
      }

      .table-container td {
        width: auto;
        padding: 10px 12px;
        border-bottom: 0;
        overflow-wrap: anywhere;
      }

      .table-container td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: var(--color-ash-gray);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .table-container td[colspan] {
        grid-column: 1 / -1;
      }

      .table-container td[colspan]::before {
        display: none;
      }

      .table-container .action-btn {
        margin: 3px 4px 3px 0;
      }

      .table-container > div:first-child {
        padding: 12px !important;
      }

      .table-container > div:first-child input {
        width: 100%;
        max-width: none !important;
      }
    }

    @media (max-width: 420px) {
      .dashboard-header h1 {
        font-size: 24px;
      }

      .tab-btn {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-view">
    <div class="login-card">
      <img src="images/logo.png" alt="De Kastro Logo" style="width: 80px; margin-bottom: 16px;">
      <h2>Staff Portal</h2>
      <form id="login-form">
        <input type="email" id="email" class="input-field" placeholder="Staff Email" required>
        <input type="password" id="password" class="input-field" placeholder="Password" required>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn-solid">Secure Login</button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD SCREEN -->
  <div id="dashboard-view">
    <div class="dashboard-header">
      <h1>Management Dashboard</h1>
      <button id="logout-btn" class="action-btn">Log Out</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-bookings">
        Active Bookings <span id="notification-badge" class="notification-badge" aria-live="polite">0</span>
      </button>
      <button class="tab-btn" id="tab-rooms">Housekeeping Status</button>
      <button class="tab-btn" id="tab-inquiries">
        Customer Inquiries <span id="inquiry-badge" class="notification-badge" aria-live="polite">0</span>
      </button>
    </div>

<!-- Bookings Panel -->
    <div id="panel-bookings" class="table-container">
      <div style="padding: 16px 24px; background: rgba(0, 0, 0, 0.1); border-bottom: 1px solid var(--color-border);">
        <input type="search" id="booking-search" class="input-field" placeholder="Search guest name or phone number..." aria-label="Search bookings" style="margin-bottom:0; max-width: 350px; padding: 10px 14px; height: 38px;">
      </div>

      <!-- Manual Booking Entry Form for Staff -->
      <div style="padding: 24px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--color-border);">
        <h3 style="font-family: var(--font-heading); color: var(--color-white); font-size: 20px; margin-top: 0; margin-bottom: 16px;">Add Walk-in / Manual Booking</h3>
        <form id="manual-booking-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) 130px; gap: 12px; align-items: end;">
  <input type="text" id="manual-name" class="input-field" placeholder="Guest Name" required style="margin-bottom:0; padding: 10px 14px; height: 38px;">
  <input type="tel" id="manual-phone" class="input-field" placeholder="Phone Number" required style="margin-bottom:0; padding: 10px 14px; height: 38px;">
  <input type="date" id="manual-checkin" class="input-field" required style="margin-bottom:0; padding: 10px 14px; height: 38px; color-scheme: dark;">
  <input type="date" id="manual-checkout" class="input-field" required style="margin-bottom:0; padding: 10px 14px; height: 38px; color-scheme: dark;">
  <select id="manual-room" class="input-field" required style="margin-bottom:0; padding: 10px 14px; height: 38px;">
    <option value="" disabled selected>Room Type</option>
    <option value="Economy">Economy</option>
    <option value="Standard">Standard</option>
    <option value="Deluxe">Deluxe</option>
    <option value="Executive">Executive</option>
  </select>
  <button type="submit" class="btn-solid" style="padding: 10px 14px; height: 38px; font-size: 13px;">Save Booking</button>
</form>
      </div>

      <table>
        <thead>
          <tr>
            <th>Guest Name</th>
            <th>Phone / WhatsApp</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookings-table-body">
          <!-- JavaScript will inject booking rows here -->
        </tbody>
      </table>
    </div>

    <!-- Rooms Panel (Hidden initially) -->
    <div id="panel-rooms" class="table-container" style="display: none;">
      <div style="padding: 16px 24px; background: rgba(0, 0, 0, 0.1); border-bottom: 1px solid var(--color-border);">
        <input type="search" id="room-search" class="input-field" placeholder="Search room number or type (e.g. 101, Standard)..." aria-label="Search rooms" style="margin-bottom:0; max-width: 350px; padding: 10px 14px; height: 38px;">
      </div>
      <table>
        <thead>
          <tr>
            <th>Room #</th>
            <th>Type</th>
            <th>Price</th>
            <th>Housekeeping</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rooms-table-body">
          <!-- JavaScript will inject room rows here -->
        </tbody>
      </table>
    </div>

    <div id="panel-inquiries" class="table-container" style="display: none;">
      <div style="padding: 16px 24px; background: rgba(0, 0, 0, 0.1); border-bottom: 1px solid var(--color-border);">
        <input type="search" id="inquiry-search" class="input-field" placeholder="Search guest name, phone, or message..." aria-label="Search inquiries" style="margin-bottom:0; max-width: 350px; padding: 10px 14px; height: 38px;">
      </div>
      <table>
        <thead>
          <tr>
            <th>Guest Name</th>
            <th>Phone / WhatsApp</th>
            <th>Message / Enquiry</th>
            <th>Date Received</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inquiries-table-body">
          <!-- Inquiries injected via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

<!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. Initialize Supabase (Use your actual URL and Anon Key)
    const SUPABASE_URL = 'https://cqyhxnyqzgjkddnwdqrw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeWh4bnlxemdqa2RkbndkcXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTE1NjAsImV4cCI6MjEwODkyNzU2MH0.WkHg3PmEAjHkmUs-HirFO3wPCL9GpNd2KXs9A3gUzxQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. DOM Elements
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    const tabBookings = document.getElementById('tab-bookings');
    const tabRooms = document.getElementById('tab-rooms');
    const tabInquiries = document.getElementById('tab-inquiries');
    const panelBookings = document.getElementById('panel-bookings');
    const panelRooms = document.getElementById('panel-rooms');
    const panelInquiries = document.getElementById('panel-inquiries');
    let bookingsChannel = null;
    let inquiriesChannel = null;
    let allInquiries = [];
    let allBookings = [];

    function isLegacyInquiry(booking) {
      return typeof booking.message === 'string' &&
        booking.message.startsWith('Enquiry:') &&
        !booking.check_in_date &&
        !booking.check_out_date;
    }

    function showDashboard() {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      fetchBookings();
      fetchRooms();
      fetchInquiries();
      subscribeToBookings();
      subscribeToInquiries();
    }

    function subscribeToBookings() {
      if (bookingsChannel) return;

      bookingsChannel = _supabase
        .channel('public:bookings')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, () => {
          fetchBookings();
        })
        .subscribe(status => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            console.error(`Bookings realtime subscription failed: ${status}`);
          }
        });
    }

    function subscribeToInquiries() {
      if (inquiriesChannel) return;

      inquiriesChannel = _supabase
        .channel('public:inquiries')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'inquiries' }, () => {
          fetchInquiries();
        })
        .subscribe(status => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            console.error(`Inquiries realtime subscription failed: ${status}`);
          }
        });
    }

    _supabase.auth.getSession()
      .then(({ data, error }) => {
        if (error) {
          loginError.textContent = `Unable to restore your session: ${error.message}`;
          return;
        }
        if (data.session) showDashboard();
      })
      .catch(error => {
        loginError.textContent = `Unable to restore your session: ${error.message || error}`;
      });

    // 3. Secure Supabase Auth Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('email').value;
      const passwordInput = document.getElementById('password').value;

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: emailInput,
        password: passwordInput,
      });

      if (error) {
        alert('Access Denied: ' + error.message);
      } else {
        showDashboard();
      }
    });

    // Logout Logic
    logoutBtn.addEventListener('click', async () => {
      try {
        const { error } = await _supabase.auth.signOut();
        if (error) {
          alert(`Unable to log out: ${error.message}`);
          return;
        }
        if (bookingsChannel) {
          await _supabase.removeChannel(bookingsChannel);
          bookingsChannel = null;
        }
        if (inquiriesChannel) {
          await _supabase.removeChannel(inquiriesChannel);
          inquiriesChannel = null;
        }
        dashboardView.style.display = 'none';
        loginView.style.display = 'flex';
        loginForm.reset();
        loginError.textContent = '';
      } catch (error) {
        alert(`Unable to log out: ${error.message || error}`);
      }
    });

    // 4. Tab Switching Logic
    tabBookings.addEventListener('click', () => {
      tabBookings.classList.add('active');
      tabRooms.classList.remove('active');
      tabInquiries.classList.remove('active');
      panelBookings.style.display = 'block';
      panelRooms.style.display = 'none';
      panelInquiries.style.display = 'none';
    });

    tabRooms.addEventListener('click', () => {
      tabRooms.classList.add('active');
      tabBookings.classList.remove('active');
      tabInquiries.classList.remove('active');
      panelRooms.style.display = 'block';
      panelBookings.style.display = 'none';
      panelInquiries.style.display = 'none';
    });

    tabInquiries.addEventListener('click', () => {
      tabInquiries.classList.add('active');
      tabBookings.classList.remove('active');
      tabRooms.classList.remove('active');
      panelInquiries.style.display = 'block';
      panelBookings.style.display = 'none';
      panelRooms.style.display = 'none';
    });

    // Live Update: Toggle Booking Payment Status
    async function togglePaymentStatus(id, currentStatus) {
      const newStatus = currentStatus === 'Pending' ? 'Paid' : 'Pending';
      const { error } = await _supabase.from('bookings').update({ payment_status: newStatus }).eq('id', id);
      if (error) {
        alert(`Unable to update booking: ${error.message}`);
        return;
      }
      fetchBookings();
    }

    let allRooms = [];
    let unreadCount = 0;

    // 5. Fetch and Display Bookings
    async function fetchBookings() {
      const { data, error } = await _supabase.from('bookings').select('*').order('id', { ascending: false });

      if (error) {
        console.error('Error fetching bookings:', error);
        document.getElementById('bookings-table-body').innerHTML =
          '<tr><td colspan="6" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">Unable to load bookings. Check the console for details.</td></tr>';
        return;
      }

      allBookings = (data || []).filter(booking => !isLegacyInquiry(booking));
      unreadCount = allBookings.filter(booking => booking.is_read === false).length;
      updateNotificationBadge();
      renderBookings(allBookings);
    }

    function updateNotificationBadge() {
      const badge = document.getElementById('notification-badge');
      badge.textContent = String(unreadCount);
      badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
    }

    // Render helper function for tables & search
    function renderBookings(bookingsToRender) {
      const tbody = document.getElementById('bookings-table-body');
      tbody.innerHTML = '';

      if (bookingsToRender.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">No matching bookings found.</td></tr>';
        return;
      }

      bookingsToRender.forEach(booking => {
        const statusClass = booking.payment_status === 'Paid' ? 'status-active' : 'status-pending';
        const isUnread = booking.is_read === false;

        tbody.innerHTML += `
          <tr class="${isUnread ? 'unread-booking' : ''}">
            <td data-label="Guest Name">
              <strong>${booking.guest_name || 'N/A'}</strong>
              ${isUnread ? '<span style="display:inline-block; width:8px; height:8px; background:var(--color-brand-orange); border-radius:50%; margin-left:6px;" title="New booking"></span>' : ''}
            </td>
            <td data-label="Phone / WhatsApp">${booking.guest_phone || 'N/A'}</td>
            <td data-label="Check-in">${booking.check_in_date || 'TBD'}</td>
            <td data-label="Check-out">${booking.check_out_date || 'TBD'}</td>
            <td data-label="Status"><span class="status-badge ${statusClass}">${booking.payment_status || 'Pending'}</span></td>
            <td data-label="Actions">
              <button class="action-btn" onclick="togglePaymentStatus(${booking.id}, '${booking.payment_status || 'Pending'}')">Toggle Payment</button>
              ${isUnread ? `<button class="action-btn" style="border-color: var(--color-brand-orange); color: var(--color-brand-orange); margin-left: 6px;" onclick="markAsRead(${booking.id})">Mark Read</button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    async function markAsRead(id) {
      const { error } = await _supabase.from('bookings').update({ is_read: true }).eq('id', id);
      if (error) {
        alert(`Unable to mark booking as read: ${error.message}`);
        return;
      }
      await fetchBookings();
    }

    // Real-Time Search Listener
    const searchInput = document.getElementById('booking-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allBookings.filter(booking => {
          const name = (booking.guest_name || '').toLowerCase();
          const phone = (booking.guest_phone || '').toLowerCase();
          return name.includes(query) || phone.includes(query);
        });
        renderBookings(filtered);
      });
    }

    async function fetchInquiries() {
      const [inquiriesResult, legacyResult] = await Promise.all([
        _supabase.from('inquiries').select('*').order('id', { ascending: false }),
        _supabase
          .from('bookings')
          .select('*')
          .ilike('message', 'Enquiry:%')
          .is('check_in_date', null)
          .is('check_out_date', null)
          .order('id', { ascending: false })
      ]);

      if (inquiriesResult.error) {
        console.error('Error fetching inquiries:', inquiriesResult.error);
      }
      if (legacyResult.error) {
        console.error('Error fetching legacy inquiries:', legacyResult.error);
      }

      if (inquiriesResult.error && legacyResult.error) {
        document.getElementById('inquiries-table-body').innerHTML =
          '<tr><td colspan="5" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">Unable to load inquiries. Check the console for details.</td></tr>';
        return;
      }

      const inquiries = (inquiriesResult.data || []).map(inquiry => ({
        ...inquiry,
        _source: 'inquiries'
      }));
      const legacyInquiries = (legacyResult.data || []).map(inquiry => ({
        ...inquiry,
        _source: 'bookings'
      }));
      allInquiries = [...inquiries, ...legacyInquiries].sort((a, b) =>
        new Date(b.created_at || 0) - new Date(a.created_at || 0)
      );
      const unreadInquiries = allInquiries.filter(inquiry => inquiry.is_read !== true).length;
      const badge = document.getElementById('inquiry-badge');
      badge.textContent = String(unreadInquiries);
      badge.style.display = unreadInquiries > 0 ? 'inline-block' : 'none';
      renderInquiries(allInquiries);

      if (inquiriesResult.error || legacyResult.error) {
        console.warn('Some inquiry sources could not be loaded; see console for details.');
      }
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function renderInquiries(inquiriesToRender) {
      const tbody = document.getElementById('inquiries-table-body');
      tbody.innerHTML = '';

      if (inquiriesToRender.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">No customer inquiries found.</td></tr>';
        return;
      }

      inquiriesToRender.forEach(inquiry => {
        const isUnread = inquiry.is_read !== true;
        const dateReceived = inquiry.created_at
          ? new Date(inquiry.created_at).toLocaleDateString()
          : 'Recent';
        const action = isUnread
          ? `<button class="action-btn" data-inquiry-id="${escapeHTML(inquiry.id)}" data-inquiry-source="${inquiry._source}">Mark Read</button>`
          : '<span style="color: var(--color-ash-gray); font-size: 12px;">Reviewed</span>';

        tbody.insertAdjacentHTML('beforeend', `
          <tr class="${isUnread ? 'unread-booking' : ''}">
            <td data-label="Guest Name"><strong>${escapeHTML(inquiry.guest_name || 'N/A')}</strong></td>
            <td data-label="Phone / WhatsApp">${escapeHTML(inquiry.guest_phone || 'N/A')}</td>
            <td data-label="Message / Enquiry" style="max-width: 300px; white-space: normal; word-break: break-word;">${escapeHTML(inquiry.message || 'N/A')}</td>
            <td data-label="Date Received">${escapeHTML(dateReceived)}</td>
            <td data-label="Actions">${action}</td>
          </tr>
        `);
      });
    }

    document.getElementById('inquiries-table-body').addEventListener('click', event => {
      const button = event.target.closest('button[data-inquiry-id]');
      if (button) markInquiryRead(button.dataset.inquiryId, button.dataset.inquirySource);
    });

    async function markInquiryRead(id, source) {
      const { error } = await _supabase
        .from(source === 'bookings' ? 'bookings' : 'inquiries')
        .update({ is_read: true })
        .eq('id', id);

      if (error) {
        alert(`Unable to mark inquiry as read: ${error.message}`);
        return;
      }
      await fetchInquiries();
    }

    const inquirySearchInput = document.getElementById('inquiry-search');
    inquirySearchInput.addEventListener('input', () => {
      const query = inquirySearchInput.value.toLowerCase().trim();
      const filtered = allInquiries.filter(inquiry =>
        String(inquiry.guest_name || '').toLowerCase().includes(query) ||
        String(inquiry.guest_phone || '').toLowerCase().includes(query) ||
        String(inquiry.message || '').toLowerCase().includes(query)
      );
      renderInquiries(filtered);
    });

    // 6. Fetch and Display Rooms
    async function fetchRooms() {
      const { data, error } = await _supabase.from('rooms').select('*').order('room_number', { ascending: true });
      if (error) {
        console.error('Error fetching rooms:', error);
        document.getElementById('rooms-table-body').innerHTML =
          '<tr><td colspan="5" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">Unable to load rooms.</td></tr>';
        return;
      }

      allRooms = data || [];
      renderRooms(allRooms);
    }

    function renderRooms(roomsToRender) {
      const tbody = document.getElementById('rooms-table-body');
      tbody.innerHTML = '';

      if (roomsToRender.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--color-ash-gray); padding: 24px;">No matching rooms found.</td></tr>';
        return;
      }

      roomsToRender.forEach(room => {
        const hkClass = room.housekeeping_status === 'Clean' ? 'status-clean' : 'status-dirty';

        tbody.innerHTML += `
          <tr>
            <td data-label="Room #"><strong>Room ${room.room_number}</strong></td>
            <td data-label="Type">${room.room_type}</td>
            <td data-label="Price">₦${room.price_per_night}</td>
            <td data-label="Housekeeping"><span class="status-badge ${hkClass}">${room.housekeeping_status || 'Unknown'}</span></td>
            <td data-label="Actions">
              <button class="action-btn" onclick="toggleHousekeeping(${room.room_number}, '${room.housekeeping_status || ''}')">Update Status</button>
            </td>
          </tr>
        `;
      });
    }

    const roomSearchInput = document.getElementById('room-search');
    roomSearchInput.addEventListener('input', () => {
      const query = roomSearchInput.value.toLowerCase().trim();
      const filtered = allRooms.filter(room =>
        String(room.room_number ?? '').toLowerCase().includes(query) ||
        String(room.room_type || '').toLowerCase().includes(query)
      );
      renderRooms(filtered);
    });

    // Live Update: Cycle Housekeeping Status (Clean -> Dirty -> Inspected)
    async function toggleHousekeeping(roomNumber, currentStatus) {
      let newStatus = 'Clean';
      if (currentStatus === 'Clean') newStatus = 'Dirty';
      else if (currentStatus === 'Dirty') newStatus = 'Inspected';

      const { error } = await _supabase.from('rooms').update({ housekeeping_status: newStatus }).eq('room_number', roomNumber);
      if (!error) fetchRooms(); // Instantly refresh the table
    }

    // Handle Manual/Walk-in Bookings by Staff
    const manualForm = document.getElementById('manual-booking-form');
    if (manualForm) {
      manualForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const manualData = {
          guest_name: document.getElementById('manual-name').value,
          guest_phone: document.getElementById('manual-phone').value,
          check_in_date: document.getElementById('manual-checkin').value,
          check_out_date: document.getElementById('manual-checkout').value,
          message: `Walk-in / Phone Booking - Room: ${document.getElementById('manual-room').value}`,
          payment_status: 'Paid', // Walk-ins usually settle payment immediately at reception
          booking_status: 'Active',
          is_read: true
        };

        const { error } = await _supabase.from('bookings').insert([manualData]);

        if (error) {
          alert('Error saving manual booking: ' + error.message);
        } else {
          alert('Manual booking successfully registered!');
          manualForm.reset();
          fetchBookings(); // Refresh the table instantly
        }
      });
    }
  </script>
</body>
</html>
