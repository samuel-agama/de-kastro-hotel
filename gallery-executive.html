<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <script src="navigation.js" defer></script>
</head>
<body>
  <header class="container flex-header">
    <a href="index.html" aria-label="De Kastro Hotel home"><img src="Images/logo.png" alt="De Kastro Hotel" class="logo-hover" style="width: 120px; height: auto;"></a>
    <nav class="header-nav" aria-label="Main navigation">

  <footer class="container" style="padding: 32px 0 40px;">
    <a href="rooms.html" class="nav-link">All rooms</a>
